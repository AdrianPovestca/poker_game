<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VS CODE POKER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .editor {
      width: 100%;
      max-width: 1100px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .topbar {
      height: 42px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #484f58;
    }

    .filename {
      margin-left: 12px;
      color: #8b949e;
      font-size: 13px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 52px 1fr;
      min-height: 620px;
    }

    .activity {
      background: #0d1117;
      border-right: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 18px;
      gap: 24px;
      color: #484f58;
      font-size: 18px;
    }

    .main {
      padding: 28px;
    }

    .code {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 26px;
    }

    .keyword {
      color: #ff7b72;
    }

    .function {
      color: #d2a8ff;
    }

    .string {
      color: #a5d6ff;
    }

    .comment {
      color: #6e7681;
    }

    .game {
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    .game-header {
      background: #161b22;
      padding: 12px 16px;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .status {
      color: #f85149;
    }

    .table {
      padding: 28px;
      background: #0b0f14;
    }

    /* =========================
       CARDS
       ========================= */

    .cards {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 28px 0;
      min-height: 102px;
      perspective: 1000px;
    }

    .card {
      width: 72px;
      height: 102px;
      position: relative;
      background: transparent;
      border-radius: 7px;
      font-family: Georgia, serif;
      font-size: 31px;
      transform-style: preserve-3d;
      transition:
        transform 0.65s cubic-bezier(.2, .7, .2, 1),
        filter 0.3s ease;
      transform: rotateY(180deg);
    }

    .card.flipped {
      transform: rotateY(0deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 7px;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      background: #f0f0f0;
      color: #111;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
    }

    .card-front.red {
      color: #d11;
    }

    .card-back {
      background:
        linear-gradient(135deg, #30363d 25%, transparent 25%) -10px 0,
        linear-gradient(225deg, #30363d 25%, transparent 25%) -10px 0,
        linear-gradient(315deg, #30363d 25%, transparent 25%),
        linear-gradient(45deg, #30363d 25%, transparent 25%);

      background-size: 20px 20px;

      background-color: #161b22;

      border: 2px solid #484f58;

      box-shadow: 0 4px 12px rgba(0, 0, 0, .35);

      transform: rotateY(180deg);
    }

    /* =========================
       RESULT
       ========================= */

    .result {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #21262d;

      opacity: 0;
      transform: translateY(10px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    }

    .result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .result-title {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .loss {
      font-size: 30px;
      color: #f85149;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .score {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 50px;
      font-size: 13px;
    }

    .score span {
      color: #8b949e;
    }

    .score strong {
      display: block;
      color: #c9d1d9;
      font-size: 22px;
      margin-top: 4px;
    }

    /* =========================
       PAYMENT PUNCHLINE
       ========================= */

    .payment {
      margin-top: 24px;

      font-size: 36px;
      font-weight: 800;
      letter-spacing: 3px;

      color: #f85149;

      opacity: 0;
      transform: translateY(10px) scale(0.96);

      transition:
        opacity 0.45s ease,
        transform 0.45s cubic-bezier(.2, .8, .2, 1);
    }

    .payment.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* =========================
       BUTTON
       ========================= */

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    button {
      background: #238636;
      border: 1px solid #2ea043;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease,
        opacity 0.2s ease;
    }

    button:hover {
      background: #2ea043;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .workspace {
        grid-template-columns: 1fr;
      }

      .activity {
        display: none;
      }

      .main {
        padding: 16px;
      }

      .card {
        width: 55px;
        height: 80px;
        font-size: 24px;
      }

      .cards {
        min-height: 80px;
        gap: 7px;
      }

      .score {
        gap: 25px;
      }

      .payment {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="editor">

    <!-- =========================
         TOP BAR
         ========================= -->

    <div class="topbar">

      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>

      <div class="filename">
        poker.py
      </div>

    </div>


    <!-- =========================
         WORKSPACE
         ========================= -->

    <div class="workspace">

      <div class="activity">

        <div>◈</div>
        <div>⌕</div>
        <div>⑂</div>
        <div>▶</div>

      </div>


      <main class="main">

        <!-- =========================
             CODE
             ========================= -->

        <div class="code">

          <div>
            <span class="keyword">import</span> poker
          </div>

          <br>

          <div>
            <span class="keyword">player</span> =
            <span class="string">"YOU"</span>
          </div>

          <div>
            <span class="keyword">opponent</span> =
            <span class="string">"VS CODE"</span>
          </div>

          <br>

          <div>
            <span class="keyword">result</span> =
            <span class="function">play_hand</span>(player, opponent)
          </div>

          <div>
            <span class="comment">
              # this is probably going badly...
            </span>
          </div>

        </div>


        <!-- =========================
             GAME
             ========================= -->

        <section class="game">

          <!-- GAME HEADER -->

          <div class="game-header">

            <span>
              TERMINAL — poker.py
            </span>

            <span class="status">
              ● LIVE
            </span>

          </div>


          <!-- TABLE -->

          <div class="table">

            <!-- CARDS -->

            <div
              class="cards"
              id="cards"
            ></div>


            <!-- RESULT -->

            <div
              class="result"
              id="result"
            >

              <div class="result-title">
                ROUND RESULT
              </div>

              <div class="loss">
                YOU LOST
              </div>


              <div class="score">

                <div>

                  <span>
                    YOU
                  </span>

                  <strong id="userScore">
                    0
                  </strong>

                </div>


                <div>

                  <span>
                    VS CODE
                  </span>

                  <strong id="codeScore">
                    1
                  </strong>

                </div>


                <div>

                  <span>
                    LOSSES
                  </span>

                  <strong id="losses">
                    1
                  </strong>

                </div>

              </div>


              <!-- PAYMENT PUNCHLINE -->

              <div
                class="payment"
                id="payment"
              >
                PAY $299
              </div>

            </div>


            <!-- BUTTON -->

            <div class="controls">

              <button
                id="gameButton"
                onclick="advanceGame()"
              >
                CONTINUE [SPACE]
              </button>

            </div>

          </div>

        </section>

      </main>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    const deck = [

      "A♠",
      "K♠",
      "Q♠",
      "J♠",
      "10♠",

      "A♥",
      "K♥",
      "Q♥",
      "J♥",
      "10♥",

      "A♦",
      "K♦",
      "Q♦",
      "J♦",
      "10♦",

      "A♣",
      "K♣",
      "Q♣",
      "J♣",
      "10♣"

    ];


    /* =========================
       SCORE
       ========================= */

    let losses = 1;

    let userWins = 0;

    let codeWins = 1;


    /* =========================
       GAME STATE
       ========================= */

    let currentCard = 0;

    let gamePhase = "reveal";

    let paymentTimer = null;

    let resultTimer = null;


    /* =========================
       ELEMENTS
       ========================= */

    const cardsContainer =
      document.getElementById("cards");

    const result =
      document.getElementById("result");

    const payment =
      document.getElementById("payment");

    const button =
      document.getElementById("gameButton");


    /* =========================
       UPDATE SCORE
       ========================= */

    function updateScore() {

      document.getElementById(
        "losses"
      ).textContent = losses;

      document.getElementById(
        "codeScore"
      ).textContent = codeWins;

      document.getElementById(
        "userScore"
      ).textContent = userWins;

    }


    /* =========================
       SHUFFLE
       ========================= */

    function shuffle(array) {

      const shuffled = [...array];

      for (
        let i = shuffled.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          shuffled[i],
          shuffled[j]
        ] = [
          shuffled[j],
          shuffled[i]
        ];

      }

      return shuffled;

    }


    /* =========================
       CREATE NEW HAND
       ========================= */

    function drawCards() {

      clearTimeout(paymentTimer);
      clearTimeout(resultTimer);

      currentCard = 0;

      gamePhase = "reveal";

      button.disabled = false;

      button.textContent =
        "CONTINUE [SPACE]";

      result.classList.remove("show");

      payment.classList.remove("show");

      cardsContainer.innerHTML = "";


      const hand =
        shuffle(deck).slice(0, 5);


      hand.forEach((card) => {

        const cardElement =
          document.createElement("div");

        cardElement.className =
          "card";


        /* =========================
           FRONT
           ========================= */

        const front =
          document.createElement("div");

        front.className =
          "card-front";


        if (
          card.includes("♥") ||
          card.includes("♦")
        ) {

          front.classList.add("red");

        }


        front.textContent = card;


        /* =========================
           BACK
           ========================= */

        const back =
          document.createElement("div");

        back.className =
          "card-back";


        /* =========================
           ADD SIDES
           ========================= */

        cardElement.appendChild(front);

        cardElement.appendChild(back);


        /* =========================
           ADD CARD
           ========================= */

        cardsContainer.appendChild(
          cardElement
        );

      });

    }


    /* =========================
       REVEAL NEXT CARD
       ========================= */

    function revealNextCard() {

      const cards =
        cardsContainer.querySelectorAll(
          ".card"
        );


      if (
        currentCard >= cards.length
      ) {

        return;

      }


      const card =
        cards[currentCard];


      card.classList.add("flipped");

      currentCard++;


      /* =========================
         FIFTH CARD
         ========================= */

      if (
        currentCard === cards.length
      ) {

        gamePhase = "result";

        button.disabled = true;


        /*
          Small pause after
          the final card.
        */

        resultTimer = setTimeout(() => {

          result.classList.add("show");


          /*
            Then reveal the
            $299 punchline.
          */

          paymentTimer = setTimeout(() => {

            payment.classList.add(
              "show"
            );

            gamePhase = "next";

            button.disabled = false;

            button.textContent =
              "PLAY AGAIN [SPACE]";

          }, 700);

        }, 450);

      }

    }


    /* =========================
       NEW GAME
       ========================= */

    function newGame() {

      losses++;

      codeWins++;

      updateScore();

      drawCards();

    }


    /* =========================
       MAIN GAME CONTROL
       ========================= */

    function advanceGame() {

      if (
        gamePhase === "reveal"
      ) {

        revealNextCard();

        return;

      }


      if (
        gamePhase === "next"
      ) {

        newGame();

        return;

      }

    }


    /* =========================
       SPACE BAR
       ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.code === "Space"
        ) {

          event.preventDefault();

          advanceGame();

        }

      }
    );


    /* =========================
       START
       ========================= */

    updateScore();

    drawCards();

  </script>

</body>
</html>
